<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semantic</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <form id="match-form" class="query">
      <input id="input" aria-label="Phrase to match" placeholder="Say something" maxlength="1000" autocomplete="off" required autofocus>
      <button type="submit" id="match-button">Send</button>
    </form>
    <div class="actions conversation-options">
      <button type="button" id="reset-button">New conversation</button>
      <button type="button" id="export-button">Save comparison</button>
      <button type="button" id="refresh-button">Refresh methods</button>
    </div>
    <p id="session-info">One input for every runnable method. Each keeps its own replies and processes turns in order. Framework history is bounded at 512 embedding tokens; model prompts have additional limits. Saved transcripts keep every turn.</p>
    <div id="comparisons" aria-label="Method comparison"></div>
    <details><summary>Unavailable methods</summary><p id="unavailable"></p></details>
    <output id="response" hidden></output>
    <p id="notice" role="status" hidden></p>
    <p id="error" role="alert" hidden></p>
    <details><summary id="bank-title">Phrase bank</summary>
    <form id="add-form">
      <input id="prompt" aria-label="New prompt" placeholder="New prompt" maxlength="1000" autocomplete="off" required>
      <input id="answer" aria-label="Response for new prompt" placeholder="Response" maxlength="8000" autocomplete="off" required>
      <div class="actions">
        <button type="submit" id="add-button">Add phrase</button>
        <button type="button" id="import-button">Load phrases (.tsv)</button>
        <input id="file" type="file" accept=".tsv,.txt,text/tab-separated-values" aria-label="Load phrase bank" hidden>
      </div>
    </form>
    <div id="bank" role="region" aria-label="Phrase bank"></div>
    </details>
  </main>
</body>
</html>
