name: native

# Compiles the Semantic native plugin for each platform and publishes the files Unity consumes
# (scripts/sync-unity-plugins.sh downloads them). Kept minimal on purpose: no model downloads;
# only the model-free checks run. Model-backed checks run locally via ctest.
on:
  push:
    branches: [main]
    paths:
      - 'Semantic.hpp'
      - 'SemanticHybrid.hpp'
      - 'bindings/*.cpp'
      - 'bindings/*.h'
      - 'bindings/*.hpp'
      - 'experiments/*.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'Semantic.hpp'
      - 'SemanticHybrid.hpp'
      - 'bindings/*.cpp'
      - 'bindings/*.h'
      - 'bindings/*.hpp'
      - 'experiments/*.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/native.yml'
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSEMANTIC_PORTABLE=ON -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release --parallel
      - name: Model-free checks
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: semantic-plugin-macos-arm64
          path: build/libSemantic.Native.dylib
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true
      # 12.x keeps Pascal (GTX 10-series) support; CUDA 13 dropped it.
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSEMANTIC_PORTABLE=ON -DSEMANTIC_VULKAN=ON -DSEMANTIC_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=61-real;75-real;86-real;89-real;89-virtual"
          cmake --build build --config Release --parallel
      - name: Model-free checks
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect plugin
        shell: bash
        run: |
          mkdir -p plugin
          cp build/bin/Release/Semantic.Native.dll build/bin/Release/llama.dll build/bin/Release/ggml*.dll plugin/
          # NVIDIA's redistributable runtime for the CUDA backend.
          cp "$CUDA_PATH/bin/cudart64_12.dll" "$CUDA_PATH/bin/cublas64_12.dll" "$CUDA_PATH/bin/cublasLt64_12.dll" plugin/
          ls -l plugin
      - uses: actions/upload-artifact@v7
        with:
          name: semantic-plugin-windows-x64
          path: plugin/
          if-no-files-found: error
