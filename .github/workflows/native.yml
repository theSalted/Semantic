name: native

# Builds and checks the Semantic native plugin on every supported platform, then publishes the
# plugin files Unity consumes (scripts/sync-unity-plugins.sh downloads them).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  EMBEDDING_REVISION: bfcd298762cc34d0357ece5ebdd31791a3a374d8
  # Small chat model with the same format as the shipped one; exercises download, prepare and hybrid.
  CI_LLM_URL: https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/23749fefcc72300e3a2ad315e1317431b06b590a/Qwen3-0.6B-Q8_0.gguf

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: models/embeddinggemma-2-Q8_0.gguf
          key: embeddinggemma-2-${{ env.EMBEDDING_REVISION }}
      - name: Embedding model
        run: scripts/download-model.sh
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSEMANTIC_PORTABLE=ON -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Checks
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Hybrid smoke (downloads the CI chat model through Semantic)
        env:
          SEMANTIC_HYBRID_CONFIG: ${{ github.workspace }}/experiments/hybrid-ci.json
          SEMANTIC_HYBRID_BANK: ${{ github.workspace }}/experiments/tagged-phrases.tsv
        run: build/Semantic.HybridSmoke models/embeddinggemma-2-Q8_0.gguf experiments/tagged-phrases.tsv
      - name: Resumable download
        run: build/Semantic.DownloadChecks "$CI_LLM_URL" "$HOME/Library/Caches/Semantic/models/Qwen3-0.6B-Q8_0.gguf" "$RUNNER_TEMP/download-checks"
      - uses: actions/upload-artifact@v7
        with:
          name: semantic-plugin-macos-arm64
          path: build/libSemantic.Native.dylib
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true
      # 12.x keeps Pascal (GTX 10-series) support; CUDA 13 dropped it.
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
      - uses: actions/cache@v6
        with:
          path: models/embeddinggemma-2-Q8_0.gguf
          key: embeddinggemma-2-${{ env.EMBEDDING_REVISION }}
      - name: Embedding model
        shell: bash
        run: scripts/download-model.sh
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DSEMANTIC_PORTABLE=ON -DSEMANTIC_VULKAN=ON -DSEMANTIC_CUDA=ON
          "-DCMAKE_CUDA_ARCHITECTURES=61-real;75-real;86-real;89-real;89-virtual"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Checks
        run: ctest --test-dir build -C Release --output-on-failure
      # The runner has no GPU, so these run on the best CPU variant; GPU backends are build-checked.
      - name: Hybrid smoke (downloads the CI chat model through Semantic)
        env:
          SEMANTIC_HYBRID_CONFIG: ${{ github.workspace }}\experiments\hybrid-ci.json
          SEMANTIC_HYBRID_BANK: ${{ github.workspace }}\experiments\tagged-phrases.tsv
        run: build\bin\Release\Semantic.HybridSmoke.exe models\embeddinggemma-2-Q8_0.gguf experiments\tagged-phrases.tsv
      - name: Resumable download
        run: build\bin\Release\Semantic.DownloadChecks.exe "$env:CI_LLM_URL" "$env:LOCALAPPDATA\Semantic\models\Qwen3-0.6B-Q8_0.gguf" "$env:RUNNER_TEMP\download-checks"
      - name: Collect plugin
        shell: bash
        run: |
          mkdir -p plugin
          cp build/bin/Release/Semantic.Native.dll build/bin/Release/llama.dll build/bin/Release/ggml*.dll plugin/
          # NVIDIA's redistributable runtime for the CUDA backend.
          cp "$CUDA_PATH/bin/cudart64_12.dll" "$CUDA_PATH/bin/cublas64_12.dll" "$CUDA_PATH/bin/cublasLt64_12.dll" plugin/
          ls -l plugin
      - uses: actions/upload-artifact@v7
        with:
          name: semantic-plugin-windows-x64
          path: plugin/
          if-no-files-found: error
